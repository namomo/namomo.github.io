name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 또는 배포할 브랜치 이름
      
permissions:
  contents: read    # 코드는 읽기만
  pages: write      # 배포는 쓰기 권한 필요
  id-token: write   # 인증용
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
