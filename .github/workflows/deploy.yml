name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 또는 배포할 브랜치 이름
      
permissions:
  contents: read    # 코드는 읽기만
  pages: write      # 배포는 쓰기 권한 필요
  id-token: write   # 인증용
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      # 1. 빌드 결과물(dist)을 임시 저장소(artifact)에 업로드합니다.
      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 2. 업로드된 파일을 실제 GitHub Pages 서비스에 배포합니다.
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
